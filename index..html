<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>C++ &amp; Networking MCQ Exam</title>
<style>
:root{--bg:#0a1230;--c:#22d3ee;--p:#8b5cf6;--b:#3b82f6;--g:#16a34a;--r:#dc2626;--y:#ca8a04;--t:#e6ecff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#2d1b78,var(--bg) 55%) fixed;color:var(--t);font:15px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh}
.w{max-width:1000px;margin:auto;padding:14px}.card{background:rgba(255,255,255,.07);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:18px;margin-bottom:14px;animation:f .4s}
@keyframes f{from{opacity:0;transform:translateY(8px)}}
h1,h2{margin:.2em 0;background:linear-gradient(90deg,var(--c),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
input{width:100%;padding:10px;margin:5px 0 10px;border-radius:10px;border:1px solid #3b4a8a;background:#0d1a45;color:var(--t)}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;color:#fff;background:linear-gradient(90deg,var(--p),var(--b));font-weight:600;margin:3px}
button.s{background:#27336b}button.d{background:var(--r)}
pre{background:#050a22;border:1px solid #2b3a7a;border-radius:10px;padding:12px;overflow-x:auto;color:var(--c)}
.o{display:block;padding:10px 12px;margin:7px 0;border:1px solid #3b4a8a;border-radius:10px;cursor:pointer}.o.sel{border-color:var(--c);background:rgba(34,211,238,.18)}
.top{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
#tm{font-size:26px;font-weight:700;color:var(--c)}#tm.low{color:#f87171}
.bar{height:8px;background:#1b2760;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--p))}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}.pal button{margin:0;padding:8px 0;background:var(--r)}.pal .a{background:var(--g)}.pal .m{background:var(--p)}.pal .cur{background:var(--b);outline:2px solid var(--c)}
.g{display:grid;grid-template-columns:1fr 250px;gap:14px}@media(max-width:760px){.g{grid-template-columns:1fr}}
.rv{border-left:5px solid var(--y)}.rv.ok{border-color:var(--g)}.rv.bad{border-color:var(--r)}
.cg{background:rgba(22,163,74,.3)}.cr{background:rgba(220,38,38,.3)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #2b3a7a;text-align:left}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--y);color:#000;padding:10px 18px;border-radius:10px;display:none;z-index:9;font-weight:700}
@media print{body{background:#fff;color:#000}.np{display:none!important}.card{background:#fff;border:1px solid #999;color:#000}h1,h2{color:#000;background:none}}
</style></head><body><div id="toast"></div><div class="w" id="app"></div>

const T=Q.length,DUR=3600,$=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=ld("exam_state",null),tick=null;
const save=()=>sv("exam_state",S);
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",4000)}

/* ===== Registration ===== */
function reg(){S=null;$("app").innerHTML=`<div class="card"><h1>C++ Programming &amp; Computer Networking</h1><p>${T} MCQs • ${T} Marks • 60 Minutes • No negative marking</p>
<label>Full Name<input id="n"></label><label>Enrollment Number<input id="e"></label><label>Branch<input id="b"></label><label>Semester<input id="s"></label><label>College Name<input id="c"></label>
<button onclick="start()">START EXAM</button><button class="s" onclick="adminLogin()">Admin Login</button></div>`}
function start(){const v=k=>$(k).value.trim();if(!["n","e","b","s","c"].every(k=>v(k)))return alert("Please fill all fields.");
S={name:v("n"),enr:v("e"),br:v("b"),sem:v("s"),col:v("c"),id:Date.now(),endAt:Date.now()+DUR*1000,ans:{},mk:{},cur:0,done:false};save();run()}

/* ===== Exam ===== */
function run(){if(S.done)return showResult();if(Date.now()>=S.endAt)return submit(true);
$("app").innerHTML=`<div class="card top"><div><h2>C++ &amp; Networking</h2><small>${esc(S.name)} • ${esc(S.enr)} • ${T} Qs • ${T} Marks</small></div><div id="tm">60:00</div></div>
<div class="g"><div><div class="card" id="qa"></div></div><div class="card"><b>Question Palette</b><div class="pal" id="pal"></div><p><small>🟩 Answered 🟥 Not answered 🟪 Review 🟦 Current</small></p><button class="d" onclick="confirmSubmit()">Submit Exam</button></div></div>`;
clearInterval(tick);tick=setInterval(timer,1000);timer();draw()}
let warned={};
function timer(){const left=Math.max(0,Math.round((S.endAt-Date.now())/1000));const m=String(Math.floor(left/60)).padStart(2,"0"),s=String(left%60).padStart(2,"0");
const el=$("tm");if(el){el.textContent=m+":"+s;el.className=left<=300?"low":""}
[[600,"⚠ 10 minutes remaining"],[300,"⚠⚠ Only 5 minutes left! Review your answers."],[60,"🚨 FINAL WARNING: 1 minute left!"]].forEach(([t,msg])=>{if(left<=t&&left>t-3&&!warned[t]){warned[t]=1;toast(msg)}});
if(left<=0)submit(true)}
function draw(){const q=Q[S.cur],i=S.cur;
$("qa").innerHTML=`<div class="bar"><i style="width:${(i+1)/T*100}%"></i></div><p>Question ${i+1} of ${T} • Answered: ${Object.keys(S.ans).length}</p><h3>${esc(q.q)}</h3>${q.code?`<pre>${esc(q.code)}</pre>`:""}
${q.o.map((o,k)=>`<label class="o ${S.ans[i]===k?"sel":""}" onclick="pick(${k})">${"ABCD"[k]}. ${esc(o)}</label>`).join("")}
<button class="s" onclick="go(${i-1})">◀ Previous</button><button onclick="go(${i+1})">Next ▶</button><button class="s" onclick="mark()">${S.mk[i]?"Unmark":"Mark for Review"}</button><button class="s" onclick="clr()">Clear Response</button>`;
$("pal").innerHTML=Q.map((_,k)=>`<button class="${k===i?"cur":S.mk[k]?"m":S.ans[k]!==undefined?"a":""}" onclick="go(${k})">${k+1}</button>`).join("")}
const pick=k=>{S.ans[S.cur]=k;save();draw()},clr=()=>{delete S.ans[S.cur];save();draw()},mark=()=>{S.mk[S.cur]=!S.mk[S.cur];save();draw()},go=k=>{if(k<0||k>=T)return;S.cur=k;save();draw()};
function confirmSubmit(){const u=T-Object.keys(S.ans).length;if(confirm(`Submit now? ${u} question(s) unanswered. This cannot be undone.`))submit(false)}

/* ===== Evaluation ===== */
function msg(s){const p=s/T*100,x=`You scored ${s} out of ${T}.`;
if(p>=85.7)return["Excellent Performance!",`Excellent Performance! ${x} Outstanding work! Keep it up. Your programming concepts and problem-solving skills are improving. Keep learning and keep growing!`];
if(p>=71.4)return["Very Good",`Very Good! ${x} You have a strong grasp of most topics. Revise the questions you missed to reach the top band.`];
if(p>=57.1)return["Needs Improvement",`Good effort! ${x} You have a basic understanding, but there is still room for improvement. Revise your concepts, practice more coding questions and aim higher in the next test.`];
if(p>=44.3)return["More Practice Required",`${x} More practice is required. Work through C++ output-prediction and OOP programs daily and revise networking devices.`];
return["Please Study Hard",`Your score is ${s} out of ${T}. Please study hard! Focus on understanding C++ fundamentals, OOP concepts and Computer Networking. Practice coding snippets daily. You can improve with consistent effort.`]}
function submit(auto){if(S.done)return;clearInterval(tick);
let c=0,w=0;Q.forEach((q,i)=>{if(S.ans[i]!==undefined){S.ans[i]===q.a?c++:w++}});
const used=Math.min(DUR,Math.round((Date.now()-S.id)/1000));
S.done=true;S.res={c,w,u:T-c-w,score:c,pct:+(c/T*100).toFixed(2),acc:c+w?+(c/(c+w)*100).toFixed(1):0,time:used,date:new Date().toLocaleString()};save();
const all=ld("exam_results",[]).filter(r=>r.id!==S.id);all.push({id:S.id,name:S.name,enr:S.enr,br:S.br,sem:S.sem,col:S.col,...S.res});sv("exam_results",all);
if(auto)alert("Time is up! Your exam was submitted automatically.");showResult()}

/* ===== Result + review + print ===== */
const fmt=s=>Math.floor(s/60)+"m "+s%60+"s";
function showResult(){const r=S.res,[t,m]=msg(r.score);
$("app").innerHTML=`<div class="card"><h1>Result — ${t}</h1><p><b>${esc(S.col)}</b> • Department Exam Portal</p>
<table><tr><td>Student</td><td>${esc(S.name)}</td><td>Enrollment</td><td>${esc(S.enr)}</td></tr><tr><td>Branch / Sem</td><td>${esc(S.br)} / ${esc(S.sem)}</td><td>Date</td><td>${r.date}</td></tr>
<tr><td>Marks</td><td>${r.score} / ${T}</td><td>Percentage</td><td>${r.pct}%</td></tr><tr><td>Correct</td><td>${r.c}</td><td>Incorrect</td><td>${r.w}</td></tr><tr><td>Unattempted</td><td>${r.u}</td><td>Time / Accuracy</td><td>${fmt(r.time)} / ${r.acc}%</td></tr></table>
<p><b>${m}</b></p>
<div class="bar" style="height:22px;display:flex"><i style="width:${r.c/T*100}%;background:var(--g)"></i><i style="width:${r.w/T*100}%;background:var(--r)"></i><i style="width:${r.u/T*100}%;background:var(--y)"></i></div><small>Green correct • Red incorrect • Yellow unattempted</small>
<div class="np"><br><button onclick="print()">Download Result (Print/PDF)</button><button class="s" onclick="if(confirm('Start a new attempt?'))reg()">New Attempt</button></div></div>
<h2 class="np">Question-wise Review</h2><div class="np">${Q.map((q,i)=>{const a=S.ans[i],st=a===undefined?"":a===q.a?"ok":"bad";return`<div class="card rv ${st}"><b>${i+1}. ${esc(q.q)}</b>${q.code?`<pre>${esc(q.code)}</pre>`:""}${q.o.map((o,k)=>`<div class="o ${k===q.a?"cg":k===a?"cr":""}">${"ABCD"[k]}. ${esc(o)}${k===q.a?" ✔ Correct":""}${k===a&&k!==q.a?" ✘ Your answer":""}</div>`).join("")}<small>${a===undefined?"Unanswered":a===q.a?"Correct":"Incorrect"}</small></div>`}).join("")}</div>`}

/* ===== Admin ===== */
function adminLogin(){$("app").innerHTML=`<div class="card"><h2>Admin Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="if($('u').value=='admin'&&$('p').value=='admin123')admin();else alert('Wrong credentials')">Login</button><button class="s" onclick="S?run():reg()">Back</button></div>`}
function admin(sort,q=""){let r=ld("exam_results",[]);if(q)r=r.filter(x=>x.enr.toLowerCase().includes(q.toLowerCase()));if(sort)r.sort((a,b)=>b.score-a.score);
const all=ld("exam_results",[]),sc=all.map(x=>x.score);
